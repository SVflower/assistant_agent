# Assistant Agent 配置模板
# 用法：复制为 config.yaml 并填入你的实际值。config.yaml 已被 gitignore，不会提交。
#
# 核心理念：换模型后端只改这个文件，业务代码零改动。
# 所有 provider 都走 OpenAI 兼容格式，云端和本地的区别只是 base_url / api_key。

# 当前启用哪个 provider（对应下面 providers 里的 key）
active: cloud

providers:
  # ---- 云端 API 示例 ----
  cloud:
    # LiteLLM 的模型名格式：见 https://docs.litellm.ai/docs/providers
    # 例：anthropic/claude-sonnet-4-6、openai/gpt-4o、gemini/gemini-1.5-pro
    model: anthropic/claude-sonnet-4-6
    # API key：建议留空，改用环境变量（如 ANTHROPIC_API_KEY / OPENAI_API_KEY）
    # 也可直接填这里，但注意 config.yaml 不要提交
    api_key: null
    api_base: null
    temperature: 0.7
    max_tokens: 4096
    context_window: 32000     # 必须填写模型真实能力；Agent 会拒绝超配
    request_timeout: 120       # 同步模型请求的最大等待秒数；中断最迟在超时/下一流片段生效
    image_input: auto          # auto 只信任可靠 metadata；未知模型按不支持图片处理
    unknown_image_token_reserve: 2048

  # ---- 本地 LM Studio 示例 ----
  local_lmstudio:
    # 本地模型统一用 openai/ 前缀走兼容端点；模型名填 LM Studio 里加载的名字
    model: openai/local-model
    api_key: "lm-studio"          # LM Studio 不校验，随便填非空值
    api_base: "http://localhost:1234/v1"
    temperature: 0.7
    max_tokens: 4096
    context_window: 8192      # 示例值；必须改成 LM Studio 当前加载模型的真实窗口
    request_timeout: 120
    image_input: disabled      # 视觉模型需由部署者明确改为 enabled
    unknown_image_token_reserve: 2048

  # ---- 本地 vLLM 示例 ----
  local_vllm:
    model: openai/Qwen/Qwen2.5-7B-Instruct
    api_key: "EMPTY"
    api_base: "http://localhost:8000/v1"
    temperature: 0.7
    max_tokens: 4096
    context_window: 32768     # 示例值；必须与 vLLM 启动时模型能力一致
    request_timeout: 120
    image_input: disabled
    unknown_image_token_reserve: 2048

attachments:
  max_attachments_per_message: 8
  max_images_per_message: 4
  max_total_bytes_per_run: 20971520
  max_text_bytes: 524288
  max_text_chars: 300000
  max_image_bytes: 8388608
  max_image_pixels: 20000000
  max_image_edge: 8192
  max_context_ratio: 0.30
  max_context_tokens: 8192
  unbound_ttl_seconds: 3600

agent:
  # 单个任务最多允许多少轮模型调用，防止跑飞
  max_iterations: 25
  # 单任务最多执行多少个工具调用（跨轮累计）
  max_tool_calls: 60
  # 单任务写入上下文的工具结果累计字符上限；0=不限制
  max_total_tool_output_chars: 80000
  # 上下文里保留的最大消息数（超过则做长度感知截断）
  max_history_messages: 60
  # 上下文 token 预算；本地小模型应按实际窗口下调
  max_context_tokens: 32000
  # 从预算里预留给模型回复的 token（可用消息预算=窗口−system−tools schema−此值）；0=不预留
  reserved_output_tokens: 4096
  # 交互式 Run 可在用户明确确认后只扩展当前 Run；超时、断线和非交互模式默认停止。
  continuation:
    max_extensions: 2
    iteration_increment: 10
    max_iterations_hard: 100
    tool_call_increment: 20
    max_tool_calls_hard: 200
    tool_output_increment: 40000
    max_tool_output_chars_hard: 400000
  # 上下文摘要压缩（M8b）：历史逼近预算时把最旧对话压成摘要，替代硬丢，防长会话失忆。
  # 默认关闭——关闭时上下文行为与硬截断逐字节一致。开启会多花摘要模型调用。
  compaction:
    enabled: false           # 开启摘要压缩
    threshold: 0.8           # 未截断历史占预算超此比例时触发
    keep_recent_turns: 4     # 绝不压缩的最近完整用户轮（保护窗）
    summary_model: ""        # 摘要用的 provider 名；空=用当前对话模型
  # 步骤级 checkpoint：模型/审批/工具边界原子保存，进程退出后可 resume。
  recovery:
    enabled: true
    dir: ".assistant_agent/runs"  # 兼容别名；默认解析到用户级 workspace state
    max_completed_runs: 100  # 只清理已同步的 terminal Run；暂停/不确定状态永不自动删除

tools:
  # [已废弃] 兼容旧配置；统一权限边界始终启用，此值不能再关闭保护。
  confirm_dangerous_shell: true
  # shell 命令超时（秒）
  shell_timeout: 120
  # 当前 Runtime 最多同时运行的受管后台进程；Runtime 关闭时全部清理
  max_background_processes: 4
  # 每个后台进程的 stdout/stderr 分别保留上限；超过后保留头尾
  max_background_output_chars: 100000
  # 单个工具结果返回 UI/上下文的最大字符数；0=不截断
  max_output_chars: 4000
  # Shell/Git 每个 stdout/stderr 流最多保留的字符数；超限继续排空但不再增长内存
  max_captured_output_chars: 1000000
  # 超大工具输出 artifact 在 workspace 内最多保留的文件数
  max_artifact_files: 100

# 内置文件/Shell/Git 工具的执行边界。off 保持宿主兼容；workspace 强制路径不越界但不是 OS 沙盒；
# container 使用 Docker/Podman 隔离命令，默认无网络且不挂载 HOME/凭据。
sandbox:
  mode: off                 # off / workspace / container
  engine: docker            # docker / podman
  image: python:3.11-slim
  network: none             # none / bridge
  memory: 1g
  cpus: 1.0
  pids_limit: 256
  user: auto                 # 禁止 root；auto 在 POSIX 映射当前用户，其他平台用 65534

permissions:
  # 应用层权限策略：readonly / workspace（推荐）/ strict / unrestricted。
  # 它决定是否执行或询问，但不是 OS 沙箱；获准进程仍拥有当前用户的系统权限。
  mode: workspace
  # 显式规则固定按 deny -> ask -> allow 优先级匹配。
  rules: []
  # 额外敏感目录；~/.ssh、~/.aws、~/.gnupg 始终默认拒绝，无需重复填写。
  sensitive_paths: []
  # rules 示例：
  # - effect: deny
  #   capability: network.access
  #   target: "*"
  #   tool: "*"

ui:
  # normal=语义摘要（默认）；verbose=脱敏调试详情；quiet=仅最终结果或错误。
  display_mode: normal
  # 是否实时显示 provider 返回的 reasoning；默认只显示思考状态。
  show_reasoning: false

logging:
  # 结构化事件日志与工具审计。日志只落本地，随 .assistant_agent/ gitignore 不入库。
  enabled: true
  # JSONL 日志目录（按天分卷：logs/YYYY-MM-DD.jsonl）
  dir: ".assistant_agent/logs"  # 兼容别名；默认解析到用户级 workspace state
  # 是否记录工具参数/输出载荷（会截断+尽力脱敏）；设 false 则只记元数据（名/耗时/状态/长度）
  log_tool_io: true
  # 单个参数/输出载荷记录的最大字符数，超出截断
  max_payload_chars: 2000

web:
  # 结构化联网工具。默认 DuckDuckGo backend 无需 key；也可切换到自建 SearXNG。
  enabled: true
  search:
    backend: duckduckgo             # duckduckgo / searxng
    max_results: 10                 # 单次搜索结果硬上限（最高 20）
    retry_attempts: 1               # 超时/限流/服务端错误的额外尝试次数（0..2）
    searxng_url: ""                 # backend=searxng 时填写，如 https://search.example.com
  request_timeout: 15
  max_response_bytes: 2000000       # 解压后响应字节上限
  max_content_chars: 30000          # 提取后正文字符上限
  max_redirects: 5                  # 每一跳都会重新做公网 URL 检查

skills:
  # 是否发现并注入技能（SKILL.md 指示书）。渐进披露：启动只注入 name/description，
  # 模型按需 load_skill 加载正文。
  enabled: true
  # 技能目录；留空用默认：./skills 与 ~/.assistant_agent/skills
  dirs: []
  # 项目/自定义 Skill 默认不进入模型上下文；可按 name 显式信任。
  # 个人目录 ~/.assistant_agent/skills 默认受信。
  trusted_project_skills: []
  # 初始提示词只注入有界 name/description；完整正文仍由 load_skill 按需读取。
  catalog_max_chars: 8000

mcp:
  # 是否启用 MCP 扩展。optional server 不阻塞 Runtime：有目录时首次调用才连接，
  # 无目录时后台发现并在下一次 Runtime 生效。工具名形如 mcp__<server>__<tool>。
  enabled: true
  # 全局 MCP 工具数上限，防大量工具 schema 撑爆上下文。
  max_total_tools: 60
  # required 启动和 optional 后台目录发现的并发上限；注册顺序仍按配置顺序稳定。
  connect_parallelism: 4
  # server 名 → 连接设置。默认无 server（下面是示例，需自备命令，取消注释启用）。
  servers: {}
  #   playwright:                         # —— stdio（本地子进程）——
  #     type: stdio                       # 默认即 stdio，可省
  #     command: npx                      # 启动命令（需已装 Node/npx）
  #     args: ["-y", "@playwright/mcp@0.0.78"] # 固定版本，避免每次启动发生供应链漂移
  #     env: {}                           # 值支持 ${VAR} 从环境插值，密钥不落配置
  #     cwd: ""                           # 空=受管运行目录；需要项目目录时显式填写
  #     enabled: true
  #     startup: optional                 # optional=目录缓存+按需连接；required=Runtime 创建期校验
  #     connect_timeout: 5                # connect/initialize/tools-list 超时；空值兼容 timeout
  #     timeout: 30                       # 单次工具调用超时（秒）
  #     auto_approve: false               # true=信任该 server 的全部当前工具（高风险）
  #     trust_tool_annotations: false     # 仅自有、固定版本 server 可设 true；第三方默认不信只读声明
  #     tool_policies:                    # 执行/恢复语义，不覆盖 permissions 的 deny/ask
  #       read_data:
  #         replay: safe_readonly         # 仅确定无副作用时配置
  #         timeout: 15                   # 可按工具覆盖 server timeout
  #       change_data:
  #         replay: requires_decision
  #         outcome_on_transport_error: unknown  # 断线后先查状态，禁止直接重试
  #     max_tools: 40                     # 该 server 工具数上限
  #     include_tools: []                 # 白名单；空=全部（再受上限约束）
  #     exclude_tools: []                 # 黑名单
  #   remote_api:                         # —— http（远程 Streamable HTTP）——
  #     type: http
  #     url: "https://mcp.example.com/mcp"
  #     headers:                          # 值支持 ${VAR} 插值，token 从环境注入不落配置
  #       Authorization: "Bearer ${MCP_TOKEN}"
  #     auto_approve: false               # 远程工具尤其不建议信任整个 server
  #     startup: optional
  #     connect_timeout: 5
  #     timeout: 30                       # session/协议头/重连由 SDK 代管；调用不自动重放
