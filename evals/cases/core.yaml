- schema_version: 1
  id: shell-large-output-artifact
  title: Shell 大输出转为 Artifact
  tags: [scripted, shell, artifact]
  task: 执行 Python 命令产生大输出，并确认返回 Artifact 引用。
  permissions:
    rules:
      - effect: allow
        capability: process.execute
        target: '${PYTHON} -c "print(''x''*20000)"'
        tool: run_shell
      - effect: allow
        capability: filesystem.write
        target: '${PYTHON} -c "print(''x''*20000)"'
        tool: run_shell
      - {effect: allow, capability: network.access, target: unknown, tool: run_shell}
  script:
    - tool_calls:
        - name: run_shell
          arguments: {command: '${PYTHON} -c "print(''x''*20000)"'}
    - final: 大输出已保存为 Artifact。
  expect:
    trajectory: strict
    expected_calls:
      - name: run_shell
        arguments: {command: '${PYTHON} -c "print(''x''*20000)"'}
        output_contains: ["[artifact:", "artifacts/tools/"]
        is_error: false
    required_tools: [run_shell]
    max_tool_calls: 1
    final_contains: [Artifact]

