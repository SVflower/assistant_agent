- schema_version: 1
  id: read-and-summarize
  title: 读取文件并总结
  tags: [scripted, real, read]
  task: 读取 note.txt 并说明其中的状态，不要修改文件。
  fixture:
    files:
      note.txt: "status: ready\nowner: team\n"
  script:
    - tool_calls:
        - name: read_file
          arguments: {path: note.txt}
      usage: {prompt_tokens: 20, completion_tokens: 5}
    - final: "状态是 ready。"
      usage: {prompt_tokens: 30, completion_tokens: 8}
  expect:
    trajectory: strict
    expected_calls:
      - name: read_file
        arguments: {path: note.txt}
    required_tools: [read_file]
    forbidden_tools: [write_file, edit_file, multi_edit, run_shell]
    max_tool_calls: 1
    final_contains: [ready]
    files:
      note.txt:
        equals: "status: ready\nowner: team\n"

- schema_version: 1
