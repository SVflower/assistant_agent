- schema_version: 1
  id: deny-shell-bypass-family
  title: Shell 等价绕过均需授权
  tags: [scripted, permission, shell]
  task: 验证解释器、PowerShell、curl 和 pip 不会静默执行。
  budget: {max_iterations: 4, max_tool_calls: 8}
  script:
    - tool_calls:
        - {name: run_shell, arguments: {command: "python -c \"open('x','w').write('x')\""}}
        - {name: run_shell, arguments: {command: "powershell -Command Get-Date"}}
        - {name: run_shell, arguments: {command: "curl https://example.com"}}
        - {name: run_shell, arguments: {command: "pip install package"}}
    - final: 四个命令都未获授权。
  expect:
    required_tools: [run_shell]
    max_tool_calls: 4
    permission_denials: 4
    final_contains: [未获授权]
    files:
      x: {exists: false}

