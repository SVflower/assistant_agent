- schema_version: 1
  id: compaction-preserves-latest
  title: 摘要压缩后保留最新任务
  tags: [scripted, compaction, context]
  task: 回答当前任务。
  history:
    - {role: user, content: 第一轮早期事实 alpha}
    - {role: assistant, content: 已记录 alpha}
    - {role: user, content: 第二轮早期事实 beta}
    - {role: assistant, content: 已记录 beta}
  budget:
    max_iterations: 3
    max_tool_calls: 2
    max_context_tokens: 8000
    reserved_output_tokens: 256
    compaction_enabled: true
    compaction_threshold: 0.01
    compaction_keep_recent_turns: 1
  script:
    - final: "摘要：保留 alpha 和 beta"
      usage: {prompt_tokens: 30, completion_tokens: 8}
    - final: "已保留最新任务并完成回答。"
      usage: {prompt_tokens: 40, completion_tokens: 10}
  expect:
    final_contains: [保留最新任务]

