        - name: edit_file
          arguments:
            path: app.yaml
            old_string: "timeout: 10"
            new_string: "timeout: 30"
    - final: 已修改 timeout。
  expect:
    trajectory: strict
    expected_calls:
      - name: read_file
        arguments: {path: app.yaml}
      - name: edit_file
        arguments:
          path: app.yaml
          old_string: "timeout: 10"
          new_string: "timeout: 30"
    required_tools: [read_file, edit_file]
    forbidden_tools: [write_file, run_shell]
    max_tool_calls: 3
    files:
      app.yaml:
        equals: "name: demo\ntimeout: 30\n"

- schema_version: 1
  id: edit-two-files
  title: 两文件一致性修改
  tags: [scripted, real, coding, multi-file]
  task: 把 a.txt 和 b.txt 中的 old 都改为 new。
  fixture:
    files:
      a.txt: "value=old\n"
      b.txt: "value=old\n"
  script:
    - tool_calls:
        - name: edit_file
          arguments: {path: a.txt, old_string: old, new_string: new}
        - name: edit_file
          arguments: {path: b.txt, old_string: old, new_string: new}
    - final: 两个文件已一致更新。
  expect:
    trajectory: unordered
    expected_calls:
      - name: edit_file
        arguments: {path: a.txt, old_string: old, new_string: new}
      - name: edit_file
        arguments: {path: b.txt, old_string: old, new_string: new}
    required_tools: [edit_file]
    forbidden_tools: [run_shell]
    max_tool_calls: 3
    files:
      a.txt: {equals: "value=new\n"}
      b.txt: {equals: "value=new\n"}

- schema_version: 1
  id: repair-small-function
  title: 修复小函数
  tags: [scripted, real, coding, repair]
  task: 修复 math_utils.py 中 add 错误的减法实现，并运行 pytest -q 验证。
  fixture:
    files:
      math_utils.py: "def add(a, b):\n    return a - b\n"
      test_math_utils.py: "from math_utils import add\n\ndef test_add():\n    assert add(2, 3) == 5\n"
  permissions:
    rules:
      - {effect: allow, capability: process.execute, target: "pytest -q", tool: run_shell}
      - {effect: allow, capability: filesystem.write, target: "pytest -q", tool: run_shell}
      - {effect: allow, capability: network.access, target: unknown, tool: run_shell}
  script:
    - tool_calls:
        - name: read_file
          arguments: {path: math_utils.py}
    - tool_calls:
        - name: edit_file
          arguments:
            path: math_utils.py
            old_string: "return a - b"
            new_string: "return a + b"
    - tool_calls:
        - name: run_shell
          arguments: {command: "pytest -q"}
    - final: add 已修复为加法且测试通过。
  expect:
    trajectory: strict
    expected_calls:
      - {name: read_file, arguments: {path: math_utils.py}}
      - name: edit_file
        arguments:
          path: math_utils.py
          old_string: "return a - b"
          new_string: "return a + b"
      - {name: run_shell, arguments: {command: "pytest -q"}}
    required_tools: [read_file, edit_file, run_shell]
    max_tool_calls: 4
    final_contains: [测试通过]
    files:
      math_utils.py:
        contains: ["return a + b"]
        not_contains: ["return a - b"]

