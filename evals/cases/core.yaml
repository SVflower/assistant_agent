- schema_version: 1
  id: recover-bad-tool-args
  title: 坏参数后恢复
  tags: [scripted, robustness]
  task: 读取 good.txt；第一次参数错误后改用正确参数。
  fixture:
    files: {good.txt: "ok\n"}
  script:
    - tool_calls:
        - name: read_file
          arguments: {path: 123}
    - tool_calls:
        - name: read_file
          arguments: {path: good.txt}
    - final: 已恢复并读到 ok。
  expect:
    trajectory: strict
    expected_calls:
      - name: read_file
        arguments: {path: 123}
        output_contains: [参数校验失败]
        is_error: true
      - name: read_file
        arguments: {path: good.txt}
        output_contains: [ok]
        is_error: false
    required_tools: [read_file]
    max_tool_calls: 2
    final_contains: [ok]

