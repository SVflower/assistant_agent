[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "assistant-agent"
version = "0.1.0"
description = "一个模型后端可自由切换（云端 API / 本地）的通用任务 Agent，编码能力优先"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "litellm>=1.51.0",
    "pydantic>=2.9.0",
    "pyyaml>=6.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "questionary>=2.0",
    "prompt-toolkit>=3.0",
    "mcp>=1.28.0,<2",
    "jsonschema>=4.23,<5",
    "httpx>=0.27,<1",
    "ruamel.yaml>=0.18,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6.0",
    "mypy>=1.11",
]

[project.scripts]
assistant-agent = "assistant_agent.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Typer 的命令参数默认值必须是 typer.Option()/Argument() 调用，这是其惯用法
"src/assistant_agent/main.py" = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
ignore_missing_imports = true
warn_unused_ignores = true
exclude = ["tests/"]

[tool.coverage.run]
source = ["assistant_agent"]
branch = true

[tool.coverage.report]
# 显示未覆盖行，让盲区显形（不设强制门槛，避免为凑数写空测试）
show_missing = true
skip_covered = false
